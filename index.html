<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic project page">
  <title>Academic Project Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <article class="paper-card">
      <header class="hero">
        <p id="venue" class="venue" hidden></p>
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
        <div id="authors" class="authors" aria-label="Authors"></div>
        <div id="affiliations" class="affiliations"></div>
        <nav id="resourceLinks" class="resource-links" aria-label="Project resources"></nav>
      </header>

      <section id="abstractSection" class="section-block">
        <h2>Abstract</h2>
        <div id="abstract" class="abstract-box"></div>
      </section>

      <section id="datasetSection" class="section-block">
        <h2 id="datasetHeading">Dataset / Overview</h2>
        <figure class="figure-card">
          <img id="teaserImage" class="teaser-image" alt="Project overview">
          <figcaption id="teaserCaption"></figcaption>
        </figure>
      </section>

      <section id="comparisonSection" class="section-block">
        <h2 id="comparisonHeading">Visual Comparisons</h2>
        <p id="comparisonHint" class="hint"></p>
        <div id="comparisonGrid" class="comparison-grid"></div>
      </section>

      <section id="citationSection" class="section-block">
        <div class="section-title-row">
          <h2>Citation</h2>
          <button id="copyBibtex" class="copy-button" type="button">复制 BibTeX</button>
        </div>
        <pre id="bibtex" tabindex="0"></pre>
      </section>
    </article>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
